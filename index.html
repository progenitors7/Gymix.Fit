    <!-- Zero-Flash (FOUC) Theme Initializer -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('gymix_theme_preference');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isAbyss = stored === 'abyss';
          var isDark = isAbyss || stored === 'dark' || ((!stored || stored === 'system') && prefersDark);
          var root = document.documentElement;
          var themeColor = isAbyss ? '#080C16' : (isDark ? '#09090B' : '#F8FAFC');
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
            if (isAbyss) {
              root.classList.add('theme-abyss');
              root.setAttribute('data-theme', 'abyss');
            }
          } else {
            root.classList.add('light');
            root.classList.remove('dark', 'theme-abyss');
            root.removeAttribute('data-theme');
            root.style.colorScheme = 'light';
          }
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', themeColor);
        } catch (e) {}
      })();
    </script>

    <!-- Automatic Recovery for Chunk Load / MIME Type Errors -->
    <script>
      window.addEventListener('error', function(e) {
        var target = e.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var reloadedKey = 'reload-attempts';
          var attempts = parseInt(sessionStorage.getItem(reloadedKey) || '0', 10);
          if (attempts < 2) {
            sessionStorage.setItem(reloadedKey, (attempts + 1).toString());
            window.location.reload();
          }
        }
      }, true);
    </script>
